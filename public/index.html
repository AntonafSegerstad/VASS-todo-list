<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>VASS Toto-List</title>
<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #e8e8e8;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 40px;
    min-height: 100vh;
    margin: 0;
  }
  .note {
    background: #fff59d;
    width: 340px;
    min-height: 400px;
    padding: 20px;
    box-shadow: 3px 3px 10px rgba(0,0,0,0.3);
    transform: rotate(-1deg);
  }
  h1 {
    text-align: center;
    font-size: 20px;
    margin-top: 0;
  }
  form {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }
  input[type="text"] {
    padding: 6px;
    border: 1px solid #c9c26b;
    border-radius: 4px;
    background: #fffde7;
  }
  input#newName {
    flex: 0 0 100px;
  }
  input#newTodo {
    flex: 1 1 150px;
  }
  button.add-btn {
    background: #558b2f;
    color: white;
    border: none;
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
  }
  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px dashed #c9c26b;
  }
  li input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: #2e7d32;
  }
  li .entry {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  li span.name {
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
    color: #8d6e00;
    outline: none;
  }
  li span.text {
    outline: none;
  }
  li.done span.text {
    text-decoration: line-through;
    color: #777;
  }
  .delete-btn {
    background: #c0392b;
    color: white;
    border: none;
    border-radius: 4px;
    padding: 3px 8px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="note">
    <h1>VASS Toto-List</h1>
    <form id="addForm">
      <input type="text" id="newName" placeholder="Namn (valfritt)" maxlength="20" autocomplete="off" />
      <input type="text" id="newTodo" placeholder="Ny todo..." autocomplete="off" />
      <button type="submit" class="add-btn">Lägg till</button>
    </form>
    <ul id="list"></ul>
  </div>

<script>
const list = document.getElementById('list');
const addForm = document.getElementById('addForm');
const newTodo = document.getElementById('newTodo');
const newName = document.getElementById('newName');

async function loadTodos() {
  const res = await fetch('/todos');
  const todos = await res.json();
  list.innerHTML = '';
  todos.forEach(renderTodo);
}

function renderTodo(todo) {
  const li = document.createElement('li');
  li.className = todo.done ? 'done' : '';

  const checkbox = document.createElement('input');
  checkbox.type = 'checkbox';
  checkbox.checked = !!todo.done;
  checkbox.addEventListener('change', () => toggleDone(todo.id, checkbox.checked));

  const entry = document.createElement('div');
  entry.className = 'entry';

  const nameSpan = document.createElement('span');
  nameSpan.className = 'name';
  nameSpan.contentEditable = true;
  nameSpan.textContent = todo.name && todo.name.trim() ? todo.name : 'Okänd';
  nameSpan.addEventListener('blur', () => editName(todo.id, nameSpan.textContent));
  nameSpan.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); nameSpan.blur(); }
  });

  const span = document.createElement('span');
  span.className = 'text';
  span.contentEditable = true;
  span.textContent = todo.text;
  span.addEventListener('blur', () => editText(todo.id, span.textContent));
  span.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); span.blur(); }
  });

  entry.appendChild(nameSpan);
  entry.appendChild(span);

  const delBtn = document.createElement('button');
  delBtn.className = 'delete-btn';
  delBtn.textContent = 'Ta bort';
  delBtn.addEventListener('click', () => deleteTodo(todo.id));

  li.appendChild(checkbox);
  li.appendChild(entry);
  li.appendChild(delBtn);
  list.appendChild(li);
}

addForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = newTodo.value.trim();
  if (!text) return;
  const name = newName.value;
  await fetch('/todos', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text, name })
  });
  newTodo.value = '';
  newName.value = '';
  loadTodos();
});

async function toggleDone(id, done) {
  await fetch(`/todos/${id}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ done })
  });
  loadTodos();
}

async function editText(id, text) {
  text = text.trim();
  if (!text) return loadTodos();
  await fetch(`/todos/${id}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text })
  });
}

async function editName(id, name) {
  await fetch(`/todos/${id}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name })
  });
  loadTodos();
}

async function deleteTodo(id) {
  await fetch(`/todos/${id}`, { method: 'DELETE' });
  loadTodos();
}

loadTodos();
</script>
</body>
</html>
